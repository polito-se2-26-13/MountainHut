
openapi: 3.0.3

info:
  title: Mountain Hut API
  version: 1.0.0
  description: |
    API for managing mountain hut service slots, reservations and authentication.
    All paths are accessed through the /api prefix.
    The Vite development server forwards API requests to the backend.

servers:
  - url: http://localhost:8000/api
    description: Local development server

tags:
  - name: Authentication
  - name: Slots
  - name: Reservations

paths:
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new hiker
      description: |
        Creates a new hiker account.
        The role field is ignored and the user is always created with the Hiker role.
        Email addresses must be unique.
      operationId: createUser

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateDTO'

      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDTO'

        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppErrorResponse'
              example:
                name: BadRequestError
                message: Bad Request
                status: 400

        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppErrorResponse'
              example:
                name: ConflictError
                message: A user with this email already exists
                status: 409

        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppErrorResponse'
              example:
                name: ValidationError
                message: Invalid email format
                status: 422

        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppErrorResponse'
              example:
                name: InternalServerError
                message: Internal Server Error
                status: 500

  /auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: |
        Authenticates a user using username and password.
        Returns an authentication token and the user's details.
      operationId: loginUser

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginDTO'

      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLoginResponse'

        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppErrorResponse'
              example:
                name: BadRequestError
                message: Empty password or username
                status: 400

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppErrorResponse'
              example:
                name: UnauthorizedError
                message: Email or password wrong
                status: 401

        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppErrorResponse'
              example:
                name: ValidationError
                message: Missing or invalid login fields
                status: 422

        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppErrorResponse'
              example:
                name: InternalServerError
                message: Internal Server Error
                status: 500

  /slots:
    post:
      tags:
        - Slots
      summary: Create a new time slot
      description: |
        Creates a new time slot.
        Only authenticated EMPLOYEE and WARDEN users can perform this operation.
        The start time must be earlier than the end time.
        The slot date and time must not be in the past.
      operationId: createSlot

      security:
        - BearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlotCreation'

      responses:
        '201':
          description: Time slot successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotResponse'

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppErrorResponse'
              example:
                name: UnauthorizedError
                message: Authentication required
                status: 401

        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppErrorResponse'
              example:
                name: ForbiddenError
                message: Insufficient permissions
                status: 403

        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppErrorResponse'
              example:
                name: ConflictError
                message: Slot conflicts with an existing slot
                status: 409

        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppErrorResponse'
              examples:
                invalidTime:
                  summary: Invalid time interval
                  value:
                    name: UnprocessableContent
                    message: Start time must be less than end time
                    status: 422
                pastSlot:
                  summary: Slot in the past
                  value:
                    name: UnprocessableContent
                    message: The slot is in the past
                    status: 422

        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppErrorResponse'
              example:
                name: InternalServerError
                message: Internal Server Error
                status: 500
    get:
      tags:
        - Slots
      summary: Get time slots
      description: |
        Retrieves the list of time slots.
        An optional date parameter can be provided to filter slots by date.
        Accessible to authenticated HIKER, EMPLOYEE and WARDEN users.
      operationId: getSlotTime

      security:
        - BearerAuth: []

      parameters:
        - name: date
          in: query
          required: false
          description: Filter time slots by date
          schema:
            type: string
            format: date
          example: "2026-12-20"

      responses:
        '200':
          description: Time slots successfully retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SlotDetail'

        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppErrorResponse'
              example:
                name: BadRequestError
                message: Bad Request
                status: 400

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppErrorResponse'
              example:
                name: UnauthorizedError
                message: Authentication required
                status: 401

        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppErrorResponse'
              example:
                name: ForbiddenError
                message: Insufficient permissions
                status: 403

        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppErrorResponse'
              example:
                name: ValidationError
                message: Invalid date format
                status: 422

        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppErrorResponse'
              example:
                name: InternalServerError
                message: Internal Server Error
                status: 500
  /slots/{slot_id}/availability:
    get:
      tags:
        - Slots
      summary: Get slot availability
      description: |
        Retrieves capacity and availability details for a specific time slot.
      operationId: getSlotAvailability

      parameters:
        - name: slot_id
          in: path
          required: true
          description: ID of the time slot
          schema:
            type: integer
          example: 1

      responses:
        '200':
          description: Slot availability successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotAvailabilityResponse'

        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppErrorResponse'
              example:
                name: NotFoundError
                message: Time slot with id 1 not found.
                status: 404

        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppErrorResponse'
              example:
                name: BadRequestError
                message: Bad Request
                status: 400

        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppErrorResponse'
              example:
                name: ValidationError
                message: Invalid slot ID
                status: 422

        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppErrorResponse'
              example:
                name: InternalServerError
                message: Internal Server Error
                status: 500
  /reservations:
    post:
      tags:
        - Reservations
      summary: Create a reservation
      description: |
        Creates a reservation for an authenticated hiker.
        The user_id is retrieved from the authentication token.
        Any user_id provided in the request body is ignored.
        The selected time slot must exist and be open for reservations.
      operationId: createReservation

      security:
        - BearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationCreate'

      responses:
        '201':
          description: Reservation successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'

        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppErrorResponse'
              example:
                name: BadRequestError
                message: Bad Request
                status: 400

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppErrorResponse'
              example:
                name: UnauthorizedError
                message: Authentication required
                status: 401

        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppErrorResponse'
              example:
                name: ForbiddenError
                message: Insufficient permissions
                status: 403

        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppErrorResponse'
              example:
                name: NotFoundError
                message: Time slot not found
                status: 404

        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppErrorResponse'
              example:
                name: ConflictError
                message: Time slot is not open
                status: 409

        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppErrorResponse'
              example:
                name: ValidationError
                message: Invalid reservation data
                status: 422

        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppErrorResponse'
              example:
                name: InternalServerError
                message: Internal Server Error
                status: 500
  /reservations/reference/{reference}:
    get:
      tags:
        - Reservations
      summary: Get reservation by booking reference
      description: |
        Retrieves a reservation using its booking reference.
        HIKER users can only access their own reservations.
        EMPLOYEE and WARDEN users can access all reservations.
      operationId: getReservationByReference

      security:
        - BearerAuth: []

      parameters:
        - name: reference
          in: path
          required: true
          description: Unique booking reference
          schema:
            type: string
          example: MH-2026-0001

      responses:
        '200':
          description: Reservation successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'

        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppErrorResponse'
              example:
                name: BadRequestError
                message: Bad Request
                status: 400

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppErrorResponse'
              example:
                name: UnauthorizedError
                message: Authentication required
                status: 401

        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppErrorResponse'
              example:
                name: ForbiddenError
                message: You cannot see other reservation
                status: 403

        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppErrorResponse'
              example:
                name: NotFoundError
                message: Booking reference not found
                status: 404

        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppErrorResponse'
              example:
                name: ValidationError
                message: Invalid booking reference
                status: 422

        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppErrorResponse'
              example:
                name: InternalServerError
                message: Internal Server Error
                status: 500
  /reservations/user:
    get:
      tags:
        - Reservations
      summary: Get reservations by authenticated user
      description: |
        Retrieves all reservations belonging to the authenticated hiker.
        The user ID is extracted from the authentication token.
        Only HIKER users can access this endpoint.
      operationId: getReservationsByUserId

      security:
        - BearerAuth: []

      responses:
        '200':
          description: User reservations successfully retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReservationResponse'

        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppErrorResponse'
              example:
                name: BadRequestError
                message: Bad Request
                status: 400

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppErrorResponse'
              example:
                name: UnauthorizedError
                message: Authentication required
                status: 401

        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppErrorResponse'
              example:
                name: ForbiddenError
                message: Insufficient permissions
                status: 403

        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppErrorResponse'
              example:
                name: ValidationError
                message: Invalid request
                status: 422

        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppErrorResponse'
              example:
                name: InternalServerError
                message: Internal Server Error
                status: 500
                
components:
  schemas:
    UserCreateDTO:
      type: object
      required:
        - email
        - password
        - firstName
        - lastName
        - phone
      properties:
        email:
          type: string
          format: email
          minLength: 5
          maxLength: 100
          example: hiker@example.com

        password:
          type: string
          minLength: 8
          example: securePassword123

        role:
          type: string
          description: Ignored during registration. The user is always created as Hiker.
          default: Hiker

        firstName:
          type: string
          description: User's first name

        lastName:
          type: string
          description: User's last name

        phone:
          type: string
          description: User's phone number

        notes:
          type: string
          nullable: true
          maxLength: 555

        emergencyContact:
          type: string
          nullable: true
          maxLength: 255

    UserResponseDTO:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          example: 1

    AppErrorResponse:
      type: object
      required:
        - name
        - message
        - status
      properties:
        name:
          type: string
          example: ConflictError

        message:
          type: string
          example: A user with this email already exists

        status:
          type: integer
          example: 409
    UserLoginDTO:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: hiker@example.com
        password:
          type: string
          example: securePassword123

    UserLoginResponse:
      type: object
      required:
        - token
        - user
      properties:
        token:
          type: string
          description: Authentication token
        user:
          $ref: '#/components/schemas/UserDetailDTO'
    UserDetailDTO:
      type: object
      required:
        - email
        - role
        - firstName
        - lastName
      properties:
        id:
          type: integer
          nullable: true
          example: 1
        email:
          type: string
          format: email
          minLength: 5
          maxLength: 100
          example: hiker@example.com
        role:
          type: string
          example: Hiker
        firstName:
          type: string
          minLength: 1
          maxLength: 100
          example: Mario
        lastName:
          type: string
          minLength: 1
          maxLength: 100
          example: Rossi
        phone:
          type: string
          nullable: true
          example: "+393331234567"
    SlotCreation:
      type: object
      required:
        - date
        - startTime
        - endTime
        - mealType
        - tables
      properties:
        date:
          type: string
          format: date
          example: "2026-12-20"
        startTime:
          type: string
          example: "12:00"
        endTime:
          type: string
          example: "14:00"
        mealType:
          type: string
          example: Lunch
        tables:
          type: array
          items:
            $ref: '#/components/schemas/Table'

    SlotResponse:
      type: object
      required:
        - slotId
        - date
        - startTime
        - endTime
        - mealType
        - tables
        - message
      properties:
        slotId:
          type: integer
          example: 1
        date:
          type: string
          format: date
        startTime:
          type: string
          example: "12:00"
        endTime:
          type: string
          example: "14:00"
        mealType:
          type: string
          example: Lunch
        tables:
          type: array
          items:
            $ref: '#/components/schemas/Table'
        message:
          type: string
          example: Slot successfully created
    Table:
      type: object
      required:
        - tableNumber
        - seats
      properties:
        tableNumber:
          type: string
          example: "T01"
        seats:
          type: integer
          example: 4

    MealType:
      type: string
      enum:
        - Lunch
        - Dinner
        - Snack
        - Breakfast
    SlotDetail:
      type: object
      required:
        - slotId
        - date
        - startTime
        - endTime
        - mealType
        - tables
      properties:
        slotId:
          type: integer
          example: 1
        date:
          type: string
          format: date
          example: "2026-12-20"
        startTime:
          type: string
          example: "12:00"
        endTime:
          type: string
          example: "14:00"
        mealType:
          $ref: '#/components/schemas/MealType'
        tables:
          type: array
          items:
            $ref: '#/components/schemas/Table'
    SlotAvailabilityResponse:
      type: object
      required:
        - slot_id
        - date
        - start_time
        - end_time
        - status
        - total_capacity
        - reserved_seats
        - remaining_seats
      properties:
        slot_id:
          type: integer
          example: 1
        date:
          type: string
          example: "2026-12-20"
        start_time:
          type: string
          example: "12:00"
        end_time:
          type: string
          example: "14:00"
        meal_type:
          type: string
          nullable: true
          example: Lunch
        status:
          type: string
          example: Available
        total_capacity:
          type: integer
          example: 40
        reserved_seats:
          type: integer
          example: 25
        remaining_seats:
          type: integer
          example: 15
    ReservationCreate:
      type: object
      required:
        - slot_id
        - party_size
        - contact_name
        - contact_email
      properties:
        slot_id:
          type: integer
          description: ID of the selected time slot
          example: 1
        party_size:
          type: integer
          minimum: 1
          description: Number of people in the party
          example: 4
        user_id:
          type: integer
          nullable: true
          description: Ignored by the API. The hiker is identified through the authentication token.
        contact_name:
          type: string
          description: Full name of contact hiker
          example: Mario Rossi
        contact_email:
          type: string
          format: email
          minLength: 5
          maxLength: 100
          description: Email for booking confirmation
          example: mario@example.com
        contact_phone:
          type: string
          nullable: true
          example: "+393331234567"
        requirements:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/Note'
    ReservationResponse:
      type: object
      required:
        - id
        - booking_reference
        - user_id
        - slot_id
        - party_size
        - contact_name
        - contact_email
        - status
      properties:
        id:
          type: integer
          example: 1
        booking_reference:
          type: string
          example: MH-2026-0001
        user_id:
          type: integer
          example: 10
        slot_id:
          type: integer
          example: 5
        date:
          type: string
          nullable: true
          example: "2026-12-20"
        start_time:
          type: string
          nullable: true
          example: "12:00"
        end_time:
          type: string
          nullable: true
          example: "14:00"
        party_size:
          type: integer
          example: 4
        special_requirements:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/Note'
        contact_name:
          type: string
          example: Mario Rossi
        contact_email:
          type: string
          format: email
          example: mario@example.com
        contact_phone:
          type: string
          nullable: true
          example: "+393331234567"
        status:
          type: string
          example: Confirmed
        assigned_tables:
          type: array
          items:
            $ref: '#/components/schemas/AssignedTableInfo'
    AssignedTableInfo:
      type: object
      required:
        - table_id
        - table_number
        - assigned_seats
      properties:
        table_id:
          type: integer
          example: 1
        table_number:
          type: string
          example: T01
        location:
          type: string
          nullable: true
          example: Ground floor
        assigned_seats:
          type: integer
          example: 4
    Note:
      type: object
      required:
        - description
        - hasAllergy
      properties:
        description:
          type: string
          example: Vegetarian meal
        hasAllergy:
          type: boolean
          example: false


services:
  app:
    image: kio2701/polito-se2-26-13:latest
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - ./server/.env

    environment:
      DB_PATH: /data/mountainHut.sqlite

    volumes:
      - mountainhut-data:/data

    ports:
      - "3000:80"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost/api/health', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mountainhut-data:

# Builds the Docker image of the whole app at every merge into dev or main and publishes it on the
# GitHub registry of the organization, as ghcr.io/polito-se2-26-13/mountainhut. main, the release of
# each sprint, is tagged latest and dev is tagged dev, both also with the commit id. It signs in with
# the token GitHub gives to every run, so no personal account is needed.
name: docker image

on:
  push:
    branches: [dev, main]

# two merges close together on the same branch publish one after the other, so the tag is always the newest commit
concurrency:
  group: docker-image-${{ github.ref_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/polito-se2-26-13/mountainhut:${{ github.ref_name == 'main' && 'latest' || 'dev' }}
            ghcr.io/polito-se2-26-13/mountainhut:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
